
# jenkins-rbac.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: monorepo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: monorepo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-role
  namespace: monorepo
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-role-binding
  namespace: monorepo
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: monorepo
roleRef:
  kind: Role
  name: jenkins-role
  apiGroup: rbac.authorization.k8s.io